<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marine Compressor and Parts</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:        #1a9c87;
      --teal-dark:   #116b5d;
      --amber:       #d4891a;
      --amber-dark:  #a06010;
      --bg:          #f0f4f3;
      --card-bg:     #ffffff;
      --navy-border: rgba(26,156,135,0.2);
      --text:        #0f2a24;
      --muted:       #5a8a82;
      --shadow:      0 12px 48px rgba(26,156,135,0.13), 0 2px 8px rgba(0,0,0,0.07);
    }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      font-family: 'Source Sans 3', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-y: auto;
      position: relative;
    }

    /* Subtle teal grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(26,156,135,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,156,135,0.05) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    /* Soft radial glow */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 80% 5%, rgba(26,156,135,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 10% 95%, rgba(212,137,26,0.08) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--navy-border);
      border-radius: 22px;
      padding: 0 0 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow);
      animation: cardIn 0.65s cubic-bezier(0.22,1,0.36,1) both;
      overflow: hidden;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* Top accent bar */
    .card-top-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--teal), var(--amber), var(--teal));
    }

    /* Logo section — white bg naturally shows here */
    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 32px 20px;
      animation: fadeUp 0.6s 0.15s both;
    }

    .logo-wrap img {
      width: 220px;
      height: auto;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 28px 20px;
      animation: fadeUp 0.6s 0.3s both;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(26,156,135,0.18);
    }
    .divider span {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--teal);
    }

    /* Tagline */
    .tagline {
      text-align: center;
      padding: 0 28px;
      margin-bottom: 24px;
      animation: fadeUp 0.6s 0.38s both;
    }
    .tagline h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(17px, 4vw, 20px);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .tagline h1 span { color: var(--teal); }
    .tagline p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Buttons */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 24px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid transparent;
      transition: transform 0.17s ease, box-shadow 0.17s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .link-btn:active { transform: scale(0.97); }

    .btn-brochure {
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
      border-color: rgba(26,156,135,0.35);
      box-shadow: 0 4px 20px rgba(26,156,135,0.22);
      animation: fadeUp 0.6s 0.5s both;
    }
    .btn-brochure:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(26,156,135,0.35);
    }

    .btn-website {
      background: linear-gradient(135deg, var(--amber) 0%, var(--amber-dark) 100%);
      border-color: rgba(212,137,26,0.35);
      box-shadow: 0 4px 20px rgba(212,137,26,0.2);
      animation: fadeUp 0.6s 0.62s both;
    }
    .btn-website:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(212,137,26,0.32);
    }

    .btn-icon {
      width: 40px; height: 40px;
      border-radius: 8px;
      background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-icon svg {
      width: 20px; height: 20px;
      fill: none; stroke: #fff;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    .btn-text { flex: 1; min-width: 0; }
    .btn-label {
      font-family: 'Oswald', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #fff;
      display: block;
      line-height: 1.2;
    }
    .btn-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 2px;
      display: block;
    }

    .btn-arrow {
      flex-shrink: 0;
      opacity: 0.65;
      transition: transform 0.17s, opacity 0.17s;
    }
    .link-btn:hover .btn-arrow { opacity: 1; transform: translateX(3px); }

    /* Footer */
    .footer {
      margin: 24px 28px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.6s 0.75s both;
    }
    .footer-line { flex: 1; height: 1px; background: rgba(26,156,135,0.15); }
    .footer span {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
