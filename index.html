<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --ink: #0d0d0d;
      --paper: #f5f0e8;
      --gold: #c8962a;
      --gold-light: #e8c46a;
      --muted: #7a7060;
      --card-bg: #fff9f0;
      --shadow: 0 8px 40px rgba(13,13,13,0.13);
    }
 
    body {
      min-height: 100vh;
      background: var(--paper);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
 
    /* Decorative background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 70% 20%, rgba(200,150,42,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 20% 80%, rgba(200,150,42,0.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
 
    /* Subtle grid lines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,150,42,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,150,42,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
 
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1.5px solid rgba(200,150,42,0.25);
      border-radius: 24px;
      padding: 52px 44px 44px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow);
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
 
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
 
    /* Top rule */
    .top-rule {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
      margin-bottom: 28px;
      animation: ruleIn 0.9s 0.2s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes ruleIn {
      from { width: 0; opacity: 0; }
      to   { width: 48px; opacity: 1; }
    }
 
    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
      animation: fadeUp 0.6s 0.25s both;
    }
 
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 900;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 14px;
      animation: fadeUp 0.6s 0.35s both;
    }
 
    h1 em {
      font-style: italic;
      color: var(--gold);
    }
 
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 38px;
      animation: fadeUp 0.6s 0.45s both;
    }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    .divider {
      border: none;
      border-top: 1px solid rgba(200,150,42,0.18);
      margin-bottom: 32px;
      animation: fadeUp 0.6s 0.5s both;
    }
 
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
 
    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 14px;
      text-decoration: none;
      border: 1.5px solid transparent;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
 
    .link-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.15s;
      border-radius: inherit;
    }
 
    .link-btn:active::after { opacity: 0.06; }
 
    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(13,13,13,0.12);
    }
 
    /* Primary — Brochure */
    .btn-brochure {
      background: linear-gradient(135deg, var(--gold) 0%, #a07420 100%);
      color: #fff;
      animation: fadeUp 0.6s 0.6s both;
    }
    .btn-brochure:hover { border-color: var(--gold-light); }
 
    /* Secondary — Website */
    .btn-website {
      background: var(--ink);
      color: #fff;
      animation: fadeUp 0.6s 0.72s both;
    }
    .btn-website:hover { border-color: #444; }
 
    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
 
    .btn-brochure .btn-icon { background: rgba(255,255,255,0.18); }
    .btn-website  .btn-icon { background: rgba(255,255,255,0.10); }
 
    .btn-icon svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
 
    .btn-text { flex: 1; }
    .btn-label {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
      color: #fff;
      display: block;
    }
    .btn-sub {
      font-size: 11.5px;
      opacity: 0.72;
      color: #fff;
      margin-top: 2px;
      display: block;
    }
 
    .btn-arrow {
      opacity: 0.6;
      transition: opacity 0.18s, transform 0.18s;
    }
    .link-btn:hover .btn-arrow { opacity: 1; transform: translateX(4px); }
 
    .footer {
      margin-top: 36px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.04em;
      animation: fadeUp 0.6s 0.85s both;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-rule"></div>
    <p class="eyebrow">Welcome</p>
    <h1>Explore Our <em>Work</em></h1>
    <p class="subtitle">
      You've scanned our QR code. Choose what you'd like to explore — download our brochure or visit our website directly.
    </p>
    <hr class="divider"/>
 
    <div class="links">
 
      <!-- BROCHURE BUTTON — replace href with your actual brochure PDF/drive link -->
      <a class="link-btn btn-brochure" href="YOUR_BROCHURE_LINK_HERE" target="_blank" rel="noopener">
        <div class="btn-icon">
          <!-- Document icon -->
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <div class="btn-text">
          <span class="btn-label">Download Brochure</span>
          <span class="btn-sub">Open or save our full brochure (PDF)</span>
        </div>
        <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
 
      <!-- WEBSITE BUTTON — replace href with your actual website URL -->
      <a class="link-btn btn-website" href="YOUR_WEBSITE_LINK_HERE" target="_blank" rel="noopener">
        <div class="btn-icon">
          <!-- Globe icon -->
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <div class="btn-text">
          <span class="btn-label">Visit Website</span>
          <span class="btn-sub">Explore everything we offer online</span>
        </div>
        <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
 
    </div>
 
    <p class="footer">Scan more · Learn more · Connect</p>
  </div>
</body>
</html>
